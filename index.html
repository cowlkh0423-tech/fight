<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<title>무혼 武魂</title>

<style>

*{
margin:0;
padding:0;
}

body{
background:#050505;
overflow:hidden;
}

canvas{
display:block;
margin:auto;
}

</style>

</head>

<body>

<canvas id="game" width="1200" height="700"></canvas>


<script>


const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");


// =================
// 키
// =================

const key={};


window.addEventListener("keydown",e=>{

key[e.key]=true;

if(e.code==="Numpad0")
key["0"]=true;

});


window.addEventListener("keyup",e=>{

key[e.key]=false;

if(e.code==="Numpad0")
key["0"]=false;

});



// =================
// 이미지
// =================


function img(file){

let i=new Image();

i.src="assets/"+file;

return i;

}


const images={

arena:img("arena.png"),
red:img("red.png"),
blue:img("blue.png"),
sword:img("sword.png"),
shield:img("shield.png"),
heal:img("heal.png")

};



// =================
// 게임 상태
// =================


let state="count";

let count=3;

let winner="";


setInterval(()=>{

if(state==="count"){

count--;

if(count<=0)
state="play";

}

},1000);




// =================
// 플레이어
// =================


class Player{


constructor(x,y,color,img,control,name){


this.x=x;
this.y=y;

this.color=color;

this.img=img;

this.name=name;

this.hp=5;

this.speed=14;

this.control=control;

this.cool=0;

this.attack=false;

this.inv=0;

}



update(enemy){



if(key[this.control.left])
this.x-=this.speed;


if(key[this.control.right])
this.x+=this.speed;


if(key[this.control.up])
this.y-=this.speed;


if(key[this.control.down])
this.y+=this.speed;




this.x=Math.max(100,Math.min(1100,this.x));
this.y=Math.max(130,Math.min(620,this.y));





if(key[this.control.attack] && this.cool<=0){

this.attack=true;

this.cool=18;

}
else{

this.attack=false;

}



if(this.cool>0)
this.cool--;


if(this.inv>0)
this.inv--;


}



draw(enemy){


ctx.save();

ctx.translate(this.x,this.y);



// 무적

if(this.inv){

ctx.strokeStyle="#00ffff";

ctx.lineWidth=6;

ctx.beginPath();

ctx.arc(
0,
0,
60,
0,
Math.PI*2
);

ctx.stroke();

}



// 캐릭터

if(this.img.complete && this.img.naturalWidth){

ctx.drawImage(
this.img,
-45,
-45,
90,
90
);

}

else{


ctx.fillStyle=this.color;


ctx.beginPath();

ctx.arc(
0,
0,
35,
0,
Math.PI*2
);

ctx.fill();



ctx.fillStyle="#222";

ctx.fillRect(
-20,
-50,
40,
20
);



}



// 검


if(this.attack){


let angle=Math.atan2(
enemy.y-this.y,
enemy.x-this.x
);


ctx.rotate(angle);



if(images.sword.complete &&
images.sword.naturalWidth){


ctx.drawImage(
images.sword,
20,
-12,
120,
25
);


}

else{


ctx.fillStyle="#eee";

ctx.fillRect(
20,
-5,
100,
10
);


}



}


ctx.restore();


}




damage(){


if(this.inv<=0)
this.hp--;

}



}





const p1=new Player(
300,
350,
"#c62828",
images.red,
{
left:"a",
right:"d",
up:"w",
down:"s",
attack:"q"
},
"홍련"
);



const p2=new Player(
900,
350,
"#1565c0",
images.blue,
{
left:"ArrowLeft",
right:"ArrowRight",
up:"ArrowUp",
down:"ArrowDown",
attack:"0"
},
"청룡"
);




// =================
// 아이템
// =================


let item=null;


setInterval(()=>{

if(state==="play"){


item={

x:250+Math.random()*700,

y:220+Math.random()*300,

type:
Math.random()<0.5?
"shield":
"heal"

};


}


},15000);







function drawItem(){


if(!item)return;


let im=
item.type==="shield"?
images.shield:
images.heal;



if(im.complete&&im.naturalWidth){

ctx.drawImage(
im,
item.x-25,
item.y-25,
50,
50
);


}

else{


ctx.font="40px serif";

ctx.fillText(
item.type==="shield"?"🔵":"🔴",
item.x,
item.y
);


}


}






function itemCheck(p){


if(!item)
return;


let d=Math.hypot(
p.x-item.x,
p.y-item.y
);


if(d<45){


if(item.type==="shield")
p.inv=180;


else
p.hp=Math.min(
5,
p.hp+2
);


item=null;


}



}






function hit(a,b){


if(!a.attack)
return;


let d=Math.hypot(
a.x-b.x,
a.y-b.y
);


if(d<120)
b.damage();


}





function background(){


// 배경


if(images.arena.complete&&images.arena.naturalWidth){


ctx.drawImage(
images.arena,
0,
0,
1200,
700
);


}

else{


let g=ctx.createLinearGradient(
0,
0,
0,
700
);


g.addColorStop(
0,
"#10182a"
);

g.addColorStop(
1,
"#3b2616"
);


ctx.fillStyle=g;

ctx.fillRect(
0,
0,
1200,
700
);



// 달

ctx.fillStyle="#fff0b0";

ctx.beginPath();

ctx.arc(
950,
120,
60,
0,
Math.PI*2
);

ctx.fill();



// 경기장

ctx.fillStyle="#765438";

ctx.beginPath();

ctx.ellipse(
600,
380,
500,
230,
0,
0,
Math.PI*2
);

ctx.fill();



ctx.strokeStyle="#d4af37";

ctx.lineWidth=12;

ctx.stroke();



}



}





function ui(){


ctx.font="32px serif";

ctx.fillStyle="#fff";


ctx.fillText(
"홍련 ❤️".repeat(p1.hp),
40,
50
);


ctx.fillText(
"청룡 ❤️".repeat(p2.hp),
850,
50
);



}






function loop(){



background();



// 제목

ctx.textAlign="center";

ctx.font="90px serif";

ctx.fillStyle="#ffd700";

ctx.shadowColor="#fff4a3";

ctx.shadowBlur=20;

ctx.fillText(
"武魂",
600,
100
);

ctx.shadowBlur=0;




if(state==="count"){


ctx.font="130px serif";

ctx.fillStyle="white";

ctx.fillText(
count,
600,
380
);



}



if(state==="play"){


p1.update(p2);
p2.update(p1);


hit(p1,p2);
hit(p2,p1);


itemCheck(p1);
itemCheck(p2);


drawItem();


p1.draw(p2);
p2.draw(p1);


ui();



if(p1.hp<=0){

winner="청룡";

state="end";

}


if(p2.hp<=0){

winner="홍련";

state="end";

}



}



if(state==="end"){


ctx.font="80px serif";

ctx.fillStyle="#ffd700";


ctx.fillText(
winner+" 승리!",
600,
350
);



}





requestAnimationFrame(loop);


}


loop();


</script>

</body>
</html>
