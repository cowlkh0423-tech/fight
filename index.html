<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLADE DUEL</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#05080d;
    font-family:Arial,"Noto Sans KR",sans-serif;
    color:white;
}

button{
    font-family:inherit;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:
        radial-gradient(
            circle at 50% 45%,
            #303b4c 0%,
            #151d2a 45%,
            #060a10 100%
        );
}

.center-line{
    position:absolute;
    left:50%;
    top:0;
    width:2px;
    height:100%;
    background:rgba(255,255,255,.08);
}

/* ==================================================
   START SCREEN
================================================== */

#startScreen{
    position:fixed;
    inset:0;
    z-index:1000;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(
            circle at center,
            #293546 0%,
            #101722 48%,
            #04070c 100%
        );
}

.startBox{
    width:680px;
    max-width:90%;
    padding:55px 60px;

    text-align:center;

    background:rgba(7,11,18,.96);

    border:1px solid rgba(255,255,255,.15);
    border-radius:24px;

    box-shadow:
        0 30px 90px rgba(0,0,0,.7),
        0 0 50px rgba(70,150,255,.08);
}

.title{
    font-size:58px;
    font-weight:900;
    letter-spacing:5px;

    text-shadow:
        0 0 15px rgba(255,255,255,.35);
}

.subtitle{
    margin-top:8px;
    color:#8e9aaa;
    font-size:15px;
    letter-spacing:5px;
}

#startButton{
    margin-top:35px;

    width:270px;
    height:68px;

    border:0;
    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            #3db4ff,
            #1761c4
        );

    color:white;

    font-size:22px;
    font-weight:bold;

    letter-spacing:2px;

    cursor:pointer;

    box-shadow:
        0 8px 28px rgba(30,130,255,.3);

    transition:
        transform .15s,
        filter .15s;
}

#startButton:hover{
    transform:translateY(-3px);
    filter:brightness(1.15);
}

#startButton:active{
    transform:translateY(1px);
}

.startInfo{
    display:flex;
    justify-content:center;
    gap:80px;

    margin-top:40px;

    color:#9da7b4;

    font-size:14px;
    line-height:1.8;
}

.startInfo b{
    color:white;
    font-size:17px;
}

.rule{
    margin-top:30px;
    color:#697482;
    font-size:14px;
}

/* ==================================================
   UI
================================================== */

#ui{
    position:absolute;
    top:18px;
    left:50%;
    transform:translateX(-50%);

    width:92%;

    display:flex;
    justify-content:space-between;
    align-items:flex-start;

    z-index:50;
}

.player-ui{
    width:320px;
}

.player-ui.right{
    text-align:right;
}

.name{
    font-size:21px;
    font-weight:bold;
    letter-spacing:1px;
    margin-bottom:7px;
}

.hp{
    display:flex;
    gap:5px;
}

.player-ui.right .hp{
    justify-content:flex-end;
}

.hp span{
    width:30px;
    height:13px;

    border-radius:4px;

    background:#43e58b;

    box-shadow:
        0 0 8px rgba(67,229,139,.45);
}

.hp span.empty{
    background:#292f39;
    box-shadow:none;
}

.score{
    margin-top:7px;
    color:#a2a8b0;
    font-size:15px;
}

/* ==================================================
   TIMER
================================================== */

#timer{
    min-width:70px;

    text-align:center;

    font-size:34px;
    font-weight:bold;

    text-shadow:
        0 0 14px rgba(255,255,255,.45);
}

/* ==================================================
   SKILLS
================================================== */

.skill-container{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.player-ui.right .skill-container{
    justify-content:flex-end;
}

.skill{
    position:relative;

    width:46px;
    height:46px;

    border-radius:50%;

    overflow:hidden;

    background:#111822;

    border:2px solid rgba(255,255,255,.15);
}

.skill svg{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    transform:rotate(-90deg);
}

.skill circle{
    fill:none;

    stroke-width:4;

    stroke-linecap:round;

    stroke-dasharray:94.2;
    stroke-dashoffset:94.2;
}

.attack-circle{
    stroke:#63d8ff;
    filter:
        drop-shadow(0 0 4px #63d8ff);
}

.defense-circle{
    stroke:#ffd84a;
    filter:
        drop-shadow(0 0 4px #ffd84a);
}

.electric-circle{
    stroke:#ff3030;
    filter:
        drop-shadow(0 0 5px #ff3030);
}

.skill-icon{
    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    font-size:17px;
}

/* ==================================================
   PLAYER
================================================== */

.player{
    position:absolute;

    width:46px;
    height:70px;

    transform:
        translateY(-50%);

    border-radius:12px;

    z-index:20;
}

#p1{
    left:70px;

    background:
        linear-gradient(
            135deg,
            #3db4ff,
            #075997
        );

    box-shadow:
        0 0 20px rgba(40,160,255,.25);
}

#p2{
    right:70px;

    background:
        linear-gradient(
            135deg,
            #ff6262,
            #9d1d29
        );

    box-shadow:
        0 0 20px rgba(255,60,60,.25);
}

.head{
    position:absolute;

    left:9px;
    top:-27px;

    width:28px;
    height:28px;

    border-radius:50%;

    background:#ffd3a3;
}

.hand-sword{
    position:absolute;

    top:29px;

    width:66px;
    height:18px;
}

.hand-sword::before{
    content:"";

    position:absolute;

    left:12px;
    top:5px;

    width:53px;
    height:8px;

    background:
        linear-gradient(
            180deg,
            #ffffff,
            #d3d9e0,
            #697381
        );

    clip-path:
        polygon(
            0 0,
            88% 0,
            100% 50%,
            88% 100%,
            0 100%
        );

    box-shadow:
        0 0 8px rgba(220,240,255,.7);
}

.hand-sword::after{
    content:"";

    position:absolute;

    left:4px;
    top:1px;

    width:6px;
    height:17px;

    border-radius:3px;

    background:
        linear-gradient(
            90deg,
            #b27b00,
            #fff1a0,
            #c48d00
        );
}

#p1 .hand-sword{
    left:31px;
}

#p2 .hand-sword{
    right:31px;
    transform:scaleX(-1);
}

/* ==================================================
   FLYING SWORD
================================================== */

.flying-sword{
    position:absolute;

    width:72px;
    height:18px;

    pointer-events:none;

    z-index:25;
}

.flying-sword::before{
    content:"";

    position:absolute;

    left:12px;
    top:5px;

    width:56px;
    height:8px;

    background:
        linear-gradient(
            180deg,
            #ffffff,
            #cbd3dc,
            #68727e
        );

    clip-path:
        polygon(
            0 0,
            86% 0,
            100% 50%,
            86% 100%,
            0 100%
        );

    box-shadow:
        0 0 8px rgba(230,245,255,.7);
}

.flying-sword::after{
    content:"";

    position:absolute;

    left:3px;
    top:2px;

    width:7px;
    height:14px;

    border-radius:4px;

    background:
        linear-gradient(
            90deg,
            #b27b00,
            #fff0a0,
            #c48d00
        );
}

/* ==================================================
   ELECTRIC SWORD
================================================== */

.electric-sword{
    position:absolute;

    width:82px;
    height:25px;

    pointer-events:none;

    z-index:27;

    filter:
        drop-shadow(0 0 5px #00eaff)
        drop-shadow(0 0 13px #008cff);
}

.electric-sword::before{
    content:"";

    position:absolute;

    left:11px;
    top:8px;

    width:64px;
    height:8px;

    background:
        linear-gradient(
            180deg,
            #ffffff,
            #61f5ff,
            #008cff
        );

    clip-path:
        polygon(
            0 0,
            84% 0,
            100% 50%,
            84% 100%,
            0 100%
        );
}

.electric-sword::after{
    content:"⚡";

    position:absolute;

    left:27px;
    top:-10px;

    font-size:24px;

    color:#c4ffff;

    text-shadow:
        0 0 5px #00eaff,
        0 0 13px #008cff;
}

/* ==================================================
   SHIELD
================================================== */

.shield{
    position:absolute;

    width:82px;
    height:110px;

    transform:
        translateY(-50%);

    border:5px solid #ffd83d;

    border-radius:50%;

    background:
        rgba(255,220,70,.08);

    box-shadow:
        0 0 20px rgba(255,210,50,.8);

    display:none;

    z-index:23;
}

#shield1{
    left:108px;
}

#shield2{
    right:108px;
}

/* ==================================================
   STUN
================================================== */

.stunned{
    animation:
        stunFlash .1s infinite alternate;
}

@keyframes stunFlash{

    from{
        filter:
            brightness(1)
            drop-shadow(0 0 5px #00eaff);
    }

    to{
        filter:
            brightness(2)
            drop-shadow(0 0 20px #00eaff);
    }

}

/* ==================================================
   ROUND MESSAGE
================================================== */

#roundMessage{
    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    font-size:58px;
    font-weight:bold;

    text-shadow:
        0 0 20px rgba(255,255,255,.65);

    display:none;

    z-index:80;
}

/* ==================================================
   GAME OVER
================================================== */

#message{
    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    min-width:430px;

    padding:45px 65px;

    text-align:center;

    background:
        rgba(5,8,15,.97);

    border:
        1px solid rgba(255,255,255,.15);

    border-radius:20px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.7);

    display:none;

    z-index:100;
}

#result{
    font-size:45px;
    font-weight:bold;
    margin-bottom:15px;
}

#message small{
    color:#aaa;
    font-size:17px;
}

/* ==================================================
   CONTROLS
================================================== */

#controls{
    position:absolute;

    bottom:18px;
    left:50%;

    transform:
        translateX(-50%);

    width:92%;

    display:flex;
    justify-content:space-between;

    color:#747b87;

    font-size:13px;

    z-index:40;
}
</style>
</head>

<body>

<!-- ==================================================
     START SCREEN
================================================== -->

<div id="startScreen">

    <div class="startBox">

        <div class="title">
            ⚔ BLADE DUEL
        </div>

        <div class="subtitle">
            1 VS 1 SWORD BATTLE
        </div>

        <button id="startButton">
            GAME START
        </button>

        <div class="startInfo">

            <div>
                <b>PLAYER 1</b><br>
                W / S : 이동<br>
                D : 검 던지기<br>
                A : 방어<br>
                Q : 전기검
            </div>

            <div>
                <b>PLAYER 2</b><br>
                ↑ / ↓ : 이동<br>
                ← : 검 던지기<br>
                → : 방어<br>
                / : 전기검
            </div>

        </div>

        <div class="rule">
            3판 2선승제
        </div>

    </div>

</div>


<!-- ==================================================
     GAME
================================================== -->

<div id="game">

    <div class="center-line"></div>


    <!-- UI -->

    <div id="ui">

        <!-- P1 -->

        <div class="player-ui">

            <div class="name">
                PLAYER 1
            </div>

            <div class="hp" id="hp1">

                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>

            </div>

            <div class="score">
                승리:
                <span id="score1">0</span>
            </div>

            <div class="skill-container">

                <div class="skill">

                    <svg viewBox="0 0 44 44">

                        <circle
                            class="attack-circle"
                            cx="22"
                            cy="22"
                            r="15">
                        </circle>

                    </svg>

                    <div class="skill-icon">
                        ⚔
                    </div>

                </div>


                <div class="skill">

                    <svg viewBox="0 0 44 44">

                        <circle
                            class="defense-circle"
                            cx="22"
                            cy="22"
                            r="15">
                        </circle>

                    </svg>

                    <div class="skill-icon">
                        🛡
                    </div>

                </div>


                <div class="skill">

                    <svg viewBox="0 0 44 44">

                        <circle
                            class="electric-circle"
                            cx="22"
                            cy="22"
                            r="15">
                        </circle>

                    </svg>

                    <div class="skill-icon">
                        ⚡
                    </div>

                </div>

            </div>

        </div>


        <!-- TIMER -->

        <div id="timer">
            30
        </div>


        <!-- P2 -->

        <div class="player-ui right">

            <div class="name">
                PLAYER 2
            </div>

            <div class="hp" id="hp2">

                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>

            </div>

            <div class="score">
                승리:
                <span id="score2">0</span>
            </div>

            <div class="skill-container">

                <div class="skill">

                    <svg viewBox="0 0 44 44">

                        <circle
                            class="attack-circle"
                            cx="22"
                            cy="22"
                            r="15">
                        </circle>

                    </svg>

                    <div class="skill-icon">
                        ⚔
                    </div>

                </div>


                <div class="skill">

                    <svg viewBox="0 0 44 44">

                        <circle
                            class="defense-circle"
                            cx="22"
                            cy="22"
                            r="15">
                        </circle>

                    </svg>

                    <div class="skill-icon">
                        🛡
                    </div>

                </div>


                <div class="skill">

                    <svg viewBox="0 0 44 44">

                        <circle
                            class="electric-circle"
                            cx="22"
                            cy="22"
                            r="15">
                        </circle>

                    </svg>

                    <div class="skill-icon">
                        ⚡
                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- PLAYERS -->

    <div id="p1" class="player">

        <div class="head"></div>

        <div class="hand-sword"></div>

    </div>


    <div id="p2" class="player">

        <div class="head"></div>

        <div class="hand-sword"></div>

    </div>


    <!-- SHIELDS -->

    <div id="shield1" class="shield"></div>

    <div id="shield2" class="shield"></div>


    <!-- ROUND MESSAGE -->

    <div id="roundMessage"></div>


    <!-- GAME OVER -->

    <div id="message">

        <div id="result"></div>

        <small>
            3판 2선승제 종료
        </small>

    </div>


    <!-- CONTROLS -->

    <div id="controls">

        <div>
            P1 : W / S 이동 · D 공격 · A 방어 · Q 전기검
        </div>

        <div>
            P2 : ↑ / ↓ 이동 · ← 공격 · → 방어 · / 전기검
        </div>

    </div>

</div>


<script>

/* ==================================================
   ELEMENTS
================================================== */

const game =
    document.getElementById("game");

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const p1 =
    document.getElementById("p1");

const p2 =
    document.getElementById("p2");

const shield1 =
    document.getElementById("shield1");

const shield2 =
    document.getElementById("shield2");

const hp1Element =
    document.getElementById("hp1");

const hp2Element =
    document.getElementById("hp2");

const score1Element =
    document.getElementById("score1");

const score2Element =
    document.getElementById("score2");

const timerElement =
    document.getElementById("timer");

const roundMessage =
    document.getElementById("roundMessage");

const message =
    document.getElementById("message");

const result =
    document.getElementById("result");


/* ==================================================
   COOLDOWN CIRCLES
================================================== */

const circles =
    document.querySelectorAll(".skill circle");

const p1AttackCircle = circles[0];
const p1DefenseCircle = circles[1];
const p1ElectricCircle = circles[2];

const p2AttackCircle = circles[3];
const p2DefenseCircle = circles[4];
const p2ElectricCircle = circles[5];


/* ==================================================
   GAME VARIABLES
================================================== */

let p1Y = 0;
let p2Y = 0;

let p1HP = 5;
let p2HP = 5;

let p1Wins = 0;
let p2Wins = 0;

let round = 1;

let timeLeft = 30;

let gameStarted = false;
let gameOver = false;
let roundEnding = false;


/* ==================================================
   SPEED
================================================== */

/* 기존 속도보다 28% 증가 */

const MOVE_SPEED = 6.4;


/* ==================================================
   COOLDOWNS
================================================== */

const ATTACK_COOLDOWN =
    800;

const DEFENSE_COOLDOWN =
    2000;

const ELECTRIC_COOLDOWN =
    3000;


/* ==================================================
   ELECTRIC STUN
================================================== */

const ELECTRIC_STUN_TIME =
    720;


/* ==================================================
   SWORD SPEED
================================================== */

const SWORD_SPEED =
    10;


/* ==================================================
   LAST USE
================================================== */

let lastAttack1 =
    -Infinity;

let lastAttack2 =
    -Infinity;

let lastDefense1 =
    -Infinity;

let lastDefense2 =
    -Infinity;

let lastElectric1 =
    -Infinity;

let lastElectric2 =
    -Infinity;


/* ==================================================
   STATES
================================================== */

let p1Defending = false;
let p2Defending = false;

let p1Stunned = false;
let p2Stunned = false;


/* ==================================================
   PROJECTILES
================================================== */

let swords = [];

let electricSwords = [];


/* ==================================================
   KEY STATE
================================================== */

const keys = {};


/* ==================================================
   START GAME
================================================== */

function startGame(){

    gameStarted = true;

    gameOver = false;

    roundEnding = false;

    p1Wins = 0;
    p2Wins = 0;

    round = 1;

    score1Element.textContent = "0";
    score2Element.textContent = "0";

    startScreen.style.display =
        "none";

    message.style.display =
        "none";

    startRound();

}


/* ==================================================
   START BUTTON
================================================== */

startButton.addEventListener(
    "click",
    startGame
);


/* ==================================================
   START ROUND
================================================== */

function startRound(){

    p1Y =
        window.innerHeight / 2;

    p2Y =
        window.innerHeight / 2;

    p1HP = 5;
    p2HP = 5;

    timeLeft = 30;

    roundEnding = false;

    p1Defending = false;
    p2Defending = false;

    p1Stunned = false;
    p2Stunned = false;


    p1.classList.remove(
        "stunned"
    );

    p2.classList.remove(
        "stunned"
    );


    shield1.style.display =
        "none";

    shield2.style.display =
        "none";


    swords.forEach(
        sword =>
            sword.element.remove()
    );


    electricSwords.forEach(
        sword =>
            sword.element.remove()
    );


    swords = [];
    electricSwords = [];


    updateHP();

    updatePositions();


    timerElement.textContent =
        timeLeft;


    roundMessage.textContent =
        "ROUND " + round;

    roundMessage.style.display =
        "block";


    setTimeout(() => {

        if(
            gameStarted &&
            !gameOver
        ){

            roundMessage.style.display =
                "none";

        }

    },1000);

}


/* ==================================================
   POSITION
================================================== */

function updatePositions(){

    p1.style.top =
        p1Y + "px";

    p2.style.top =
        p2Y + "px";

    shield1.style.top =
        p1Y + "px";

    shield2.style.top =
        p2Y + "px";

}


/* ==================================================
   KEY DOWN
================================================== */

document.addEventListener(
    "keydown",
    function(e){

        if(!gameStarted){
            return;
        }

        keys[e.key] = true;


        if(gameOver){
            return;
        }


        /* P1 ATTACK */

        if(
            e.key.toLowerCase() === "d" &&
            !e.repeat
        ){

            throwSword(1);

        }


        /* P2 ATTACK */

        if(
            e.key === "ArrowLeft" &&
            !e.repeat
        ){

            throwSword(2);

        }


        /* P1 DEFENSE */

        if(
            e.key.toLowerCase() === "a" &&
            !e.repeat
        ){

            activateDefense(1);

        }


        /* P2 DEFENSE */

        if(
            e.key === "ArrowRight" &&
            !e.repeat
        ){

            activateDefense(2);

        }


        /* P1 ELECTRIC */

        if(
            e.key.toLowerCase() === "q" &&
            !e.repeat
        ){

            throwElectricSword(1);

        }


        /* ==========================================
           P2 ELECTRIC

           ★ 일반 키보드 "/" 키

           숫자패드 NumpadDivide 사용 X
        ========================================== */

        if(
            e.key === "/" &&
            !e.repeat
        ){

            throwElectricSword(2);

        }

    }
);


/* ==================================================
   KEY UP
================================================== */

document.addEventListener(
    "keyup",
    function(e){

        keys[e.key] = false;

    }
);


/* ==================================================
   NORMAL SWORD
================================================== */

function throwSword(player){

    if(
        !gameStarted ||
        gameOver ||
        roundEnding
    ){

        return;

    }


    if(
        player === 1 &&
        p1Stunned
    ){

        return;

    }


    if(
        player === 2 &&
        p2Stunned
    ){

        return;

    }


    const now =
        performance.now();


    if(player === 1){

        if(
            now - lastAttack1 <
            ATTACK_COOLDOWN
        ){

            return;

        }

        lastAttack1 = now;

    }

    else{

        if(
            now - lastAttack2 <
            ATTACK_COOLDOWN
        ){

            return;

        }

        lastAttack2 = now;

    }


    const sword =
        document.createElement(
            "div"
        );

    sword.className =
        "flying-sword";


    let x;
    let y;
    let direction;


    if(player === 1){

        x = 120;

        y = p1Y;

        direction = 1;

        sword.style.transform =
            "scaleX(1)";

    }

    else{

        x =
            window.innerWidth - 190;

        y = p2Y;

        direction = -1;

        sword.style.transform =
            "scaleX(-1)";

    }


    sword.style.left =
        x + "px";

    sword.style.top =
        (y - 8) + "px";


    game.appendChild(
        sword
    );


    swords.push({

        element:sword,

        x:x,

        y:y,

        direction:direction,

        owner:player

    });

}


/* ==================================================
   ELECTRIC SWORD
================================================== */

function throwElectricSword(player){

    if(
        !gameStarted ||
        gameOver ||
        roundEnding
    ){

        return;

    }


    if(
        player === 1 &&
        p1Stunned
    ){

        return;

    }


    if(
        player === 2 &&
        p2Stunned
    ){

        return;

    }


    const now =
        performance.now();


    if(player === 1){

        if(
            now - lastElectric1 <
            ELECTRIC_COOLDOWN
        ){

            return;

        }

        lastElectric1 = now;

    }

    else{

        if(
            now - lastElectric2 <
            ELECTRIC_COOLDOWN
        ){

            return;

        }

        lastElectric2 = now;

    }


    const sword =
        document.createElement(
            "div"
        );

    sword.className =
        "electric-sword";


    let x;
    let y;
    let direction;


    if(player === 1){

        x = 120;

        y = p1Y;

        direction = 1;

        sword.style.transform =
            "scaleX(1)";

    }

    else{

        x =
            window.innerWidth - 190;

        y = p2Y;

        direction = -1;

        sword.style.transform =
            "scaleX(-1)";

    }


    sword.style.left =
        x + "px";

    sword.style.top =
        (y - 10) + "px";


    game.appendChild(
        sword
    );


    electricSwords.push({

        element:sword,

        x:x,

        y:y,

        direction:direction,

        owner:player

    });

}


/* ==================================================
   DEFENSE
================================================== */

function activateDefense(player){

    if(
        !gameStarted ||
        gameOver ||
        roundEnding
    ){

        return;

    }


    const now =
        performance.now();


    if(player === 1){

        if(
            p1Stunned ||
            now - lastDefense1 <
            DEFENSE_COOLDOWN
        ){

            return;

        }


        lastDefense1 = now;

        p1Defending = true;

        shield1.style.display =
            "block";


        setTimeout(() => {

            p1Defending = false;

            shield1.style.display =
                "none";

        },700);

    }

    else{

        if(
            p2Stunned ||
            now - lastDefense2 <
            DEFENSE_COOLDOWN
        ){

            return;

        }


        lastDefense2 = now;

        p2Defending = true;

        shield2.style.display =
            "block";


        setTimeout(() => {

            p2Defending = false;

            shield2.style.display =
                "none";

        },700);

    }

}


/* ==================================================
   HP
================================================== */

function updateHP(){

    const hp1 =
        hp1Element.children;

    const hp2 =
        hp2Element.children;


    for(
        let i=0;
        i<5;
        i++
    ){

        hp1[i].classList.toggle(
            "empty",
            i >= p1HP
        );

        hp2[i].classList.toggle(
            "empty",
            i >= p2HP
        );

    }

}


/* ==================================================
   HIT
================================================== */

function hitPlayer(player){

    if(player === 1){

        if(p1Defending){
            return;
        }

        p1HP--;

    }

    else{

        if(p2Defending){
            return;
        }

        p2HP--;

    }


    updateHP();


    if(
        p1HP <= 0 ||
        p2HP <= 0
    ){

        endRound();

    }

}


/* ==================================================
   STUN
================================================== */

function stunPlayer(player){

    if(player === 1){

        if(p1Stunned){
            return;
        }


        p1Stunned = true;

        p1.classList.add(
            "stunned"
        );


        setTimeout(() => {

            p1Stunned = false;

            p1.classList.remove(
                "stunned"
            );

        },ELECTRIC_STUN_TIME);

    }

    else{

        if(p2Stunned){
            return;
        }


        p2Stunned = true;

        p2.classList.add(
            "stunned"
        );


        setTimeout(() => {

            p2Stunned = false;

            p2.classList.remove(
                "stunned"
            );

        },ELECTRIC_STUN_TIME);

    }

}


/* ==================================================
   END ROUND
================================================== */

function endRound(){

    if(roundEnding){
        return;
    }


    roundEnding = true;


    let winner;


    if(p1HP > p2HP){

        winner = 1;

    }

    else if(p2HP > p1HP){

        winner = 2;

    }

    else{

        winner = 0;

    }


    if(winner === 1){

        p1Wins++;

    }

    else if(winner === 2){

        p2Wins++;

    }


    score1Element.textContent =
        p1Wins;

    score2Element.textContent =
        p2Wins;


    /* 2승 */

    if(
        p1Wins >= 2 ||
        p2Wins >= 2
    ){

        endGame();

        return;

    }


    round++;


    if(winner === 1){

        roundMessage.textContent =
            "PLAYER 1 WIN";

    }

    else if(winner === 2){

        roundMessage.textContent =
            "PLAYER 2 WIN";

    }

    else{

        roundMessage.textContent =
            "DRAW";

    }


    roundMessage.style.display =
        "block";


    setTimeout(() => {

        if(!gameOver){

            startRound();

        }

    },1500);

}


/* ==================================================
   END GAME
================================================== */

function endGame(){

    gameOver = true;


    if(p1Wins > p2Wins){

        result.textContent =
            "🏆 PLAYER 1 WIN!";

    }

    else{

        result.textContent =
            "🏆 PLAYER 2 WIN!";

    }


    message.style.display =
        "block";

}


/* ==================================================
   COOLDOWN CIRCLE
================================================== */

function setCircle(
    circle,
    progress
){

    const circumference =
        94.2;

    const offset =
        circumference *
        (1-progress);

    circle.style.strokeDashoffset =
        offset;

}


/* ==================================================
   UPDATE COOLDOWNS
================================================== */

function updateCooldowns(){

    const now =
        performance.now();


    const attack1 =
        Math.min(
            1,
            (now-lastAttack1) /
            ATTACK_COOLDOWN
        );

    const defense1 =
        Math.min(
            1,
            (now-lastDefense1) /
            DEFENSE_COOLDOWN
        );

    const electric1 =
        Math.min(
            1,
            (now-lastElectric1) /
            ELECTRIC_COOLDOWN
        );


    const attack2 =
        Math.min(
            1,
            (now-lastAttack2) /
            ATTACK_COOLDOWN
        );

    const defense2 =
        Math.min(
            1,
            (now-lastDefense2) /
            DEFENSE_COOLDOWN
        );

    const electric2 =
        Math.min(
            1,
            (now-lastElectric2) /
            ELECTRIC_COOLDOWN
        );


    setCircle(
        p1AttackCircle,
        attack1
    );

    setCircle(
        p1DefenseCircle,
        defense1
    );

    setCircle(
        p1ElectricCircle,
        electric1
    );


    setCircle(
        p2AttackCircle,
        attack2
    );

    setCircle(
        p2DefenseCircle,
        defense2
    );

    setCircle(
        p2ElectricCircle,
        electric2
    );

}


/* ==================================================
   MAIN UPDATE
================================================== */

function update(){

    if(
        gameStarted &&
        !gameOver &&
        !roundEnding
    ){

        /* P1 */

        if(!p1Stunned){

            if(
                keys["w"] ||
                keys["W"]
            ){

                p1Y -=
                    MOVE_SPEED;

            }

            if(
                keys["s"] ||
                keys["S"]
            ){

                p1Y +=
                    MOVE_SPEED;

            }

        }


        /* P2 */

        if(!p2Stunned){

            if(keys["ArrowUp"]){

                p2Y -=
                    MOVE_SPEED;

            }

            if(keys["ArrowDown"]){

                p2Y +=
                    MOVE_SPEED;

            }

        }


        /* LIMIT */

        p1Y =
            Math.max(
                105,
                Math.min(
                    window.innerHeight - 105,
                    p1Y
                )
            );


        p2Y =
            Math.max(
                105,
                Math.min(
                    window.innerHeight - 105,
                    p2Y
                )
            );


        updatePositions();


        /* ==================================================
           NORMAL SWORDS
        ================================================== */

        for(
            let i=swords.length-1;
            i>=0;
            i--
        ){

            const s =
                swords[i];


            s.x +=
                s.direction *
                SWORD_SPEED;


            s.element.style.left =
                s.x + "px";


            if(
                s.x < -100 ||
                s.x >
                window.innerWidth + 100
            ){

                s.element.remove();

                swords.splice(i,1);

                continue;

            }


            /* P1 → P2 */

            if(
                s.owner === 1 &&
                s.x + 60 >=
                window.innerWidth - 125 &&
                Math.abs(
                    s.y-p2Y
                ) < 55
            ){

                hitPlayer(2);

                s.element.remove();

                swords.splice(i,1);

                continue;

            }


            /* P2 → P1 */

            if(
                s.owner === 2 &&
                s.x <= 125 &&
                Math.abs(
                    s.y-p1Y
                ) < 55
            ){

                hitPlayer(1);

                s.element.remove();

                swords.splice(i,1);

                continue;

            }

        }


        /* ==================================================
           ELECTRIC SWORDS
        ================================================== */

        for(
            let i=electricSwords.length-1;
            i>=0;
            i--
        ){

            const s =
                electricSwords[i];


            s.x +=
                s.direction *
                SWORD_SPEED;


            s.element.style.left =
                s.x + "px";


            if(
                s.x < -120 ||
                s.x >
                window.innerWidth + 120
            ){

                s.element.remove();

                electricSwords.splice(i,1);

                continue;

            }


            /* P1 → P2 */

            if(
                s.owner === 1 &&
                s.x + 70 >=
                window.innerWidth - 125 &&
                Math.abs(
                    s.y-p2Y
                ) < 55
            ){

                stunPlayer(2);

                s.element.remove();

                electricSwords.splice(i,1);

                continue;

            }


            /* P2 → P1 */

            if(
                s.owner === 2 &&
                s.x <= 125 &&
                Math.abs(
                    s.y-p1Y
                ) < 55
            ){

                stunPlayer(1);

                s.element.remove();

                electricSwords.splice(i,1);

                continue;

            }

        }

    }


    updateCooldowns();


    requestAnimationFrame(
        update
    );

}


/* ==================================================
   TIMER
================================================== */

setInterval(() => {

    if(
        !gameStarted ||
        gameOver ||
        roundEnding
    ){

        return;

    }


    timeLeft--;

    timerElement.textContent =
        timeLeft;


    if(timeLeft <= 0){

        endRound();

    }

},1000);


/* ==================================================
   INITIALIZE
================================================== */

update();

updateHP();

</script>
